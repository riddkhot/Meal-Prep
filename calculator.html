<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calorie Calculator · PrepWise</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="wrap section">
    <h1>Calorie Calculator</h1>
    <p class="lead">Find your daily calorie target. Every meal suggestion after this is sized to it.</p>

    <div class="calc-layout">
      <form id="calc-form" class="card" novalidate>
        <div class="field">
          <label>Units</label>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="units" value="metric" checked /><span>Metric (kg, cm)</span></label>
            <label><input type="radio" name="units" value="imperial" /><span>Imperial (lb, ft)</span></label>
          </div>
        </div>

        <div class="field">
          <label>Sex</label>
          <div class="seg" role="radiogroup">
            <label><input type="radio" name="sex" value="male" checked /><span>Male</span></label>
            <label><input type="radio" name="sex" value="female" /><span>Female</span></label>
          </div>
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="age">Age</label>
            <input id="age" name="age" type="number" min="15" max="90" placeholder="30" required />
          </div>
          <div class="field">
            <label for="weight">Weight <span class="unit" data-metric="(kg)" data-imperial="(lb)">(kg)</span></label>
            <input id="weight" name="weight" type="number" step="0.1" min="30" placeholder="70" required />
          </div>
        </div>

        <div class="field">
          <label>Height <span class="unit" data-metric="(cm)" data-imperial="(ft / in)">(cm)</span></label>
          <div id="height-metric"><input id="heightCm" name="heightCm" type="number" min="120" max="230" placeholder="175" /></div>
          <div id="height-imperial" class="grid-2" hidden>
            <input id="heightFt" name="heightFt" type="number" min="4" max="7" placeholder="5 ft" />
            <input id="heightIn" name="heightIn" type="number" min="0" max="11" placeholder="9 in" />
          </div>
        </div>

        <div class="field">
          <label for="activity">Activity level</label>
          <select id="activity" name="activity">
            <option value="1.2">Sedentary: desk job, little exercise</option>
            <option value="1.375">Light: exercise 1–3 days/week</option>
            <option value="1.55" selected>Moderate: exercise 3–5 days/week</option>
            <option value="1.725">Very active: hard exercise 6–7 days/week</option>
            <option value="1.9">Athlete: physical job + training</option>
          </select>
        </div>

        <div class="field">
          <label>Goal</label>
          <div class="seg seg-wrap" role="radiogroup">
            <label><input type="radio" name="goal" value="-500" /><span>Lose weight</span></label>
            <label><input type="radio" name="goal" value="-250" /><span>Lose slowly</span></label>
            <label><input type="radio" name="goal" value="0" checked /><span>Maintain</span></label>
            <label><input type="radio" name="goal" value="300" /><span>Build muscle</span></label>
          </div>
        </div>

        <p id="form-error" class="error" hidden></p>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Calculate my target</button>
      </form>

      <section id="results" class="card results empty">
        <div class="empty-state">
          <div class="big-emoji">🔢</div>
          <p>Fill in the form to see your daily calories, macros and per-meal budget.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/calculator.js"></script>
</body>
</html>
